<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220"
     role="img" aria-label="Quote by John Carmack">
  <title>John Carmack on learning</title>

  <defs>
    <linearGradient id="quoteGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A277FF"/>
      <stop offset="50%"  stop-color="#61FFCA"/>
      <stop offset="100%" stop-color="#A277FF"/>
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%"   dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .card   { fill: #0F111A; }
    .bar    { stroke: #2A2F45; }
    .file   { fill: #565F89; }
    .text   { fill: #C0CAF5; }
    .author { fill: #61FFCA; }
    .mark   { fill: #A277FF; opacity: .16; }

    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }

    .fade { opacity: 0; animation: fadeIn .6s ease-out forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .45s; }
    .d3 { animation-delay: .75s; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

  <rect class="card" x="2" y="2" width="896" height="216" rx="16"
        stroke="url(#quoteGlow)" stroke-width="2.5"/>

  <circle cx="36" cy="36" r="6.5" fill="#FF6767"/>
  <circle cx="58" cy="36" r="6.5" fill="#FFCA85"/>
  <circle cx="80" cy="36" r="6.5" fill="#61FFCA"/>
  <text class="mono file" x="110" y="41" font-size="13">carmack.txt</text>
  <line class="bar" x1="20" y1="60" x2="880" y2="60" stroke-width="1"/>

  <text class="mark" x="34" y="156" font-family="Georgia, serif" font-size="130">&#8220;</text>

  <text class="mono text fade d1" x="96" y="114" font-size="19">
    You can't learn everything, but you have to
  </text>
  <text class="mono text fade d2" x="96" y="146" font-size="19">
    convince yourself that you can learn anything.
  </text>

  <text class="mono author fade d3" x="864" y="190" text-anchor="end"
        font-size="15" font-style="italic">— John Carmack</text>
</svg>
