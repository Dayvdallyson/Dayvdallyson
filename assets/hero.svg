<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     role="img" aria-label="Dayvd Costa - Tech Lead and Backend Software Engineer">
  <defs>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A277FF"/>
      <stop offset="50%"  stop-color="#61FFCA"/>
      <stop offset="100%" stop-color="#D97757"/>
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%"   dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="typeClip">
      <rect x="56" y="158" width="0" height="40">
        <animate attributeName="width" values="0;640" dur="2.6s" begin="1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .card   { fill: #0F111A; }
    .bar    { stroke: #2A2F45; }
    .muted  { fill: #565F89; }
    .name   { fill: #C0CAF5; }
    .role   { fill: #61FFCA; }
    .chip   { fill: #1A1E2E; stroke: #2A2F45; }
    .chipTx { fill: #A9B1D6; }
    .cursor { fill: #61FFCA; }

    @media (prefers-color-scheme: light) {
      .card   { fill: #FFFFFF; }
      .bar    { stroke: #D8DEE9; }
      .muted  { fill: #8A91A8; }
      .name   { fill: #14161F; }
      .role   { fill: #0F9D77; }
      .chip   { fill: #F3F5F9; stroke: #D8DEE9; }
      .chipTx { fill: #3B4252; }
      .cursor { fill: #0F9D77; }
    }

    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    .fade { opacity: 0; animation: fadeIn .7s ease-out forwards; }
    .f1 { animation-delay: .2s; } .f2 { animation-delay: 3.6s; }
    .f3 { animation-delay: 3.8s; } .f4 { animation-delay: 4.0s; }
    .f5 { animation-delay: 4.2s; } .f6 { animation-delay: 4.4s; }
    @keyframes fadeIn { to { opacity: 1; } }

    .blink { animation: blink 1s steps(2) infinite; animation-delay: 3.6s; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <rect class="card" x="2" y="2" width="896" height="296" rx="18"
        stroke="url(#heroGlow)" stroke-width="2.5"/>

  <circle cx="36" cy="38" r="6.5" fill="#FF6767"/>
  <circle cx="58" cy="38" r="6.5" fill="#FFCA85"/>
  <circle cx="80" cy="38" r="6.5" fill="#61FFCA"/>
  <text class="mono muted" x="110" y="43" font-size="13">~/dayvd-costa — zsh</text>
  <line class="bar" x1="20" y1="62" x2="880" y2="62" stroke-width="1"/>

  <text class="mono muted fade f1" x="56" y="104" font-size="15">
    <tspan fill="#A277FF">$</tspan> whoami
  </text>

  <text class="mono name fade f1" x="56" y="140" font-size="34" font-weight="700">Dayvd Costa</text>

  <g clip-path="url(#typeClip)">
    <text class="mono role" x="56" y="186" font-size="19">Tech Lead &amp; Backend Software Engineer</text>
  </g>
  <rect class="cursor blink" x="56" y="168" width="10" height="22">
    <animate attributeName="x" values="56;400" dur="2.6s" begin="1s" fill="freeze"/>
  </rect>

  <text class="mono muted fade f2" x="56" y="218" font-size="14">
    Distributed Systems · Event-Driven Architecture · LLMs &amp; Agentic Systems
  </text>

  <g class="fade f3">
    <rect class="chip" x="56"  y="240" width="96"  height="30" rx="15"/>
    <text class="mono chipTx" x="104" y="260" font-size="12" text-anchor="middle">Python</text>
  </g>
  <g class="fade f4">
    <rect class="chip" x="162" y="240" width="104" height="30" rx="15"/>
    <text class="mono chipTx" x="214" y="260" font-size="12" text-anchor="middle">LangGraph</text>
  </g>
  <g class="fade f5">
    <rect class="chip" x="276" y="240" width="90"  height="30" rx="15"/>
    <text class="mono chipTx" x="321" y="260" font-size="12" text-anchor="middle">Kafka</text>
  </g>
  <g class="fade f6">
    <rect class="chip" x="376" y="240" width="90"  height="30" rx="15"/>
    <text class="mono chipTx" x="421" y="260" font-size="12" text-anchor="middle">AWS</text>
  </g>
  <g class="fade f6">
    <rect class="chip" x="476" y="240" width="110" height="30" rx="15"/>
    <text class="mono chipTx" x="531" y="260" font-size="12" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>
