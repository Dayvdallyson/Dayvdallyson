<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     role="img" aria-label="Dayvd Costa - Software Engineer, Python, AI Engineering, AWS">
  <title>Dayvd Costa — Software Engineer | Python | AI Engineering | AWS</title>

  <defs>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A277FF"/>
      <stop offset="50%"  stop-color="#61FFCA"/>
      <stop offset="100%" stop-color="#D97757"/>
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%"   dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- typing mask: width must end where the text ends (49 chars * ~11.4px) -->
    <clipPath id="typeClip">
      <rect x="56" y="162" width="0" height="34">
        <animate attributeName="width" values="0;566" dur="1.9s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .card   { fill: #0F111A; }
    .bar    { stroke: #2A2F45; }
    .muted  { fill: #565F89; }
    .name   { fill: #C0CAF5; }
    .role   { fill: #61FFCA; }
    .pipe   { fill: #565F89; }
    .chip   { fill: #1A1E2E; stroke: #2A2F45; }
    .chipTx { fill: #A9B1D6; }
    .cursor { fill: #61FFCA; }

    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }

    .fade { opacity: 0; animation: fadeIn .6s ease-out forwards; }
    .f1 { animation-delay: .15s; } .f2 { animation-delay: 2.5s; }
    .f3 { animation-delay: 2.65s; } .f4 { animation-delay: 2.78s; }
    .f5 { animation-delay: 2.91s; } .f6 { animation-delay: 3.04s; }
    .f7 { animation-delay: 3.17s; }
    @keyframes fadeIn { to { opacity: 1; } }

    .blink { animation: blink 1.05s steps(2) infinite; animation-delay: 2.5s; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <rect class="card" x="2" y="2" width="896" height="296" rx="18"
        stroke="url(#heroGlow)" stroke-width="2.5"/>

  <circle cx="36" cy="38" r="6.5" fill="#FF6767"/>
  <circle cx="58" cy="38" r="6.5" fill="#FFCA85"/>
  <circle cx="80" cy="38" r="6.5" fill="#61FFCA"/>
  <text class="mono muted" x="110" y="43" font-size="13">~/dayvd-costa — zsh</text>
  <line class="bar" x1="20" y1="62" x2="880" y2="62" stroke-width="1"/>

  <text class="mono muted fade f1" x="56" y="104" font-size="15">
    <tspan fill="#A277FF">$</tspan> whoami
  </text>

  <text class="mono name fade f1" x="56" y="142" font-size="34" font-weight="700">Dayvd Costa</text>

  <g clip-path="url(#typeClip)">
    <text class="mono role" x="56" y="188" font-size="19" xml:space="preserve">Software Engineer <tspan class="pipe">|</tspan> Python <tspan class="pipe">|</tspan> AI Engineering <tspan class="pipe">|</tspan> AWS</text>
  </g>
  <rect class="cursor blink" x="56" y="170" width="10" height="22">
    <animate attributeName="x" values="56;618" dur="1.9s" begin="0.6s" fill="freeze"/>
  </rect>

  <text class="mono muted fade f2" x="56" y="220" font-size="14">
    Distributed Systems · Event-Driven Architecture · LLMs &amp; Agentic Systems
  </text>

  <g class="fade f3">
    <rect class="chip" x="56"  y="242" width="86"  height="30" rx="15"/>
    <text class="mono chipTx" x="99"  y="262" font-size="12" text-anchor="middle">FastAPI</text>
  </g>
  <g class="fade f4">
    <rect class="chip" x="152" y="242" width="104" height="30" rx="15"/>
    <text class="mono chipTx" x="204" y="262" font-size="12" text-anchor="middle">LangGraph</text>
  </g>
  <g class="fade f5">
    <rect class="chip" x="266" y="242" width="76"  height="30" rx="15"/>
    <text class="mono chipTx" x="304" y="262" font-size="12" text-anchor="middle">Kafka</text>
  </g>
  <g class="fade f6">
    <rect class="chip" x="352" y="242" width="110" height="30" rx="15"/>
    <text class="mono chipTx" x="407" y="262" font-size="12" text-anchor="middle">PostgreSQL</text>
  </g>
  <g class="fade f7">
    <rect class="chip" x="472" y="242" width="84"  height="30" rx="15"/>
    <text class="mono chipTx" x="514" y="262" font-size="12" text-anchor="middle">Docker</text>
  </g>
</svg>
