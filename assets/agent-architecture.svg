<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     role="img" aria-label="Multi-agent customer support: customer request goes to a supervisor that routes to Order, Refund and Knowledge agents, each backed by Orders API, Payments API and pgvector">
  <title>Multi-agent customer support — request flow</title>

  <style>
    .node   { fill: #151925; stroke: #2A2F45; }
    .sup    { fill: #1C1730; stroke: #A277FF; }
    .leaf   { fill: #121620; stroke: #232838; }
    .edge   { stroke: #2A2F45; fill: none; }
    .label  { fill: #C0CAF5; }
    .sub    { fill: #565F89; }
    .title  { fill: #A277FF; }
    .dot    { fill: #61FFCA; }

    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <text class="mono title" x="40" y="36" font-size="15" letter-spacing="1.5">MULTI-AGENT CUSTOMER SUPPORT — REQUEST FLOW</text>

  <!-- edges -->
  <path class="edge" d="M450,116 V150" stroke-width="1.5"/>
  <path class="edge" d="M450,210 C450,250 165,240 165,280" stroke-width="1.5"/>
  <path class="edge" d="M450,210 V280" stroke-width="1.5"/>
  <path class="edge" d="M450,210 C450,250 735,240 735,280" stroke-width="1.5"/>
  <path class="edge" d="M165,344 V400" stroke-width="1.5"/>
  <path class="edge" d="M450,344 V400" stroke-width="1.5"/>
  <path class="edge" d="M735,344 V400" stroke-width="1.5"/>

  <!-- in-flight requests -->
  <circle class="dot" r="4">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M450,116 V150 M450,210 C450,250 165,240 165,280 M165,344 V400"/>
  </circle>
  <circle class="dot" r="4" opacity=".8">
    <animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite"
      path="M450,116 V150 M450,210 V280 M450,344 V400"/>
  </circle>
  <circle class="dot" r="4" opacity=".8">
    <animateMotion dur="4.5s" begin="3s" repeatCount="indefinite"
      path="M450,116 V150 M450,210 C450,250 735,240 735,280 M735,344 V400"/>
  </circle>

  <!-- entry -->
  <rect class="node" x="325" y="60" width="250" height="56" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="450" y="86"  font-size="16" text-anchor="middle">Customer</text>
  <text class="mono sub"   x="450" y="105" font-size="12" text-anchor="middle">natural language request</text>

  <!-- supervisor -->
  <rect class="sup" x="325" y="150" width="250" height="60" rx="12" stroke-width="2"/>
  <text class="mono label" x="450" y="178" font-size="16" text-anchor="middle" font-weight="600">Supervisor</text>
  <text class="mono sub"   x="450" y="197" font-size="12" text-anchor="middle">intent routing · state</text>

  <!-- agents -->
  <rect class="node" x="40" y="280" width="250" height="64" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="165" y="308" font-size="16" text-anchor="middle">Order Agent</text>
  <text class="mono sub"   x="165" y="328" font-size="12" text-anchor="middle">stock · tracking</text>

  <rect class="node" x="325" y="280" width="250" height="64" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="450" y="308" font-size="16" text-anchor="middle">Refund Agent</text>
  <text class="mono sub"   x="450" y="328" font-size="12" text-anchor="middle">human-in-the-loop</text>

  <rect class="node" x="610" y="280" width="250" height="64" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="735" y="308" font-size="16" text-anchor="middle">Knowledge Agent</text>
  <text class="mono sub"   x="735" y="328" font-size="12" text-anchor="middle">policy RAG</text>

  <!-- backends -->
  <rect class="leaf" x="40" y="400" width="250" height="58" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="165" y="426" font-size="15" text-anchor="middle">Orders API</text>
  <text class="mono sub"   x="165" y="445" font-size="11" text-anchor="middle">REST · idempotent</text>

  <rect class="leaf" x="325" y="400" width="250" height="58" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="450" y="426" font-size="15" text-anchor="middle">Payments API</text>
  <text class="mono sub"   x="450" y="445" font-size="11" text-anchor="middle">refund · chargeback</text>

  <rect class="leaf" x="610" y="400" width="250" height="58" rx="12" stroke-width="1.5"/>
  <text class="mono label" x="735" y="426" font-size="15" text-anchor="middle">pgvector</text>
  <text class="mono sub"   x="735" y="445" font-size="11" text-anchor="middle">policy embeddings</text>

  <text class="mono sub" x="40" y="498" font-size="12">
    FastAPI · LangGraph · pgvector · Redis · Kafka · AWS (SQS, SNS, Lambda, RDS, ECS)
  </text>
</svg>
